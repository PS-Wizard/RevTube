# Rate limiting zone: 10 requests per second per IP, shared across all workers
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    # Hide nginx version from Server headers and error pages
    server_tokens off;

    # Use Docker's internal DNS for runtime upstream resolution.
    # This prevents startup crashes if backend DNS isn't ready yet.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Hashed assets (JS, CSS, images) — immutable, cache forever
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — never cache, so users always get the latest asset references
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:3000;

        # Long-running AI endpoints (e.g. playlist/thumbnail analysis) can take
        # minutes. The nginx default proxy_read_timeout is 60s, which would
        # abort those requests with a 504 while the backend is still working.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Allow video metadata + AI analysis payloads that exceed the 1m default
        client_max_body_size 10m;
        # Account for large AI JSON responses in memory to avoid disk buffering
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Email $http_x_user_email;
        proxy_set_header Authorization $http_authorization;

        # Upstream errors return a clean JSON body instead of the default nginx
        # HTML error page (which leaks the server version). Status code is kept.
        error_page 500 502 503 504 /50x.json;
    }

    # Bull Board queue monitoring UI — proxy to backend behind auth
    location /admin/queues {
        limit_req zone=api burst=10 nodelay;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Email $http_x_user_email;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
